<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>云盘文件管理</title>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tree.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Splash — light, clean entrance -->
  <div id="splash">
    <div class="splash-line"></div>
    <h1 class="splash-title">云盘</h1>
    <p class="splash-sub">轻量·去重·快速</p>
  </div>

  <!-- Preview Modal -->
  <div id="preview-modal" style="display:none;position:fixed;inset:0;z-index:9998;align-items:center;justify-content:center;">
    <div id="preview-box" style="background:var(--color-surface-solid);border-radius:var(--radius-lg);max-width:90vw;max-height:85vh;width:800px;display:flex;flex-direction:column;overflow:hidden;">
      <div id="preview-header" style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-12) var(--space-20);border-bottom:1px solid var(--color-border);">
        <span id="preview-title" style="font-family:var(--font-display);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);color:var(--color-text-primary);"></span>
        <button id="preview-close" aria-label="关闭预览">✕</button>
      </div>
      <div id="preview-body" style="flex:1;overflow:auto;padding:var(--space-20);max-height:70vh;"></div>
    </div>
  </div>

  <!-- Header -->
  <header id="header">
    <span id="app-title">云盘</span>
    <div class="header-actions">
      <span id="header-user"></span>
      <button id="theme-toggle" title="切换主题" aria-label="切换主题">
        <span class="theme-icon-light">☀</span>
        <span class="theme-icon-dark">☾</span>
      </button>
      <button id="btn-logout" title="退出登录" aria-label="退出登录">退出</button>
    </div>
  </header>

  <!-- Main Layout -->
  <main id="app">
    <!-- Left: Directory Tree -->
    <aside id="tree-panel">
      <div id="tree-header">
        <span id="tree-title">目录</span>
      </div>
      <nav id="directory-tree" role="tree"></nav>
    </aside>

    <!-- Right: File Grid -->
    <section id="grid-panel">
      <div id="grid-toolbar">
        <input type="search" id="search-input" placeholder="搜索文件…" aria-label="搜索文件">
        <select id="sort-select" aria-label="排序方式">
          <option value="name-asc">名称 ↑</option>
          <option value="name-desc">名称 ↓</option>
          <option value="size-desc">大小 ↓</option>
          <option value="size-asc">大小 ↑</option>
          <option value="time-desc">时间 ↓</option>
        </select>
        <button id="btn-upload" aria-label="上传文件">上传</button>
        <button id="btn-new-folder" aria-label="新建目录">新建目录</button>
        <button id="btn-delete" aria-label="删除选中" disabled>删除</button>
        <button id="btn-trash" aria-label="回收站">回收站</button>
      </div>
      <div id="path-bar"></div>
      <div id="file-grid" role="list"></div>
    </section>
  </main>

  <!-- Mobile -->
  <button id="hamburger" aria-label="打开目录菜单" hidden>☰</button>
  <div id="overlay-backdrop" hidden></div>

  <!-- Hidden file input -->
  <input type="file" id="file-input" hidden multiple>

  <!-- Scripts -->
  <script src="js/state.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/skeleton.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/tree.js" defer></script>
  <script src="js/grid.js" defer></script>
  <script src="js/upload.js" defer></script>

  <!-- Auth guard -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.Auth || !window.Auth.requireAuth()) return;
      var user = window.Auth.getUser();
      if (user) document.getElementById('header-user').textContent = user.username;
      document.getElementById('btn-logout').addEventListener('click', function() {
        window.Auth.logout();
      });
    });
  </script>

  <script>
    document.getElementById('splash').onclick = function() { this.remove(); };
  </script>
</body>
</html>
