<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>云盘 — 登录</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: var(--color-bg);
      font-family: var(--font-body);
      color: var(--color-text-primary);
    }

    /* Soft ambient glow */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%; left: -10%;
      width: 50%; height: 60%;
      background: radial-gradient(ellipse, rgba(45,138,122,0.04) 0%, transparent 70%);
      border-radius: 50%;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -10%; right: -5%;
      width: 45%; height: 50%;
      background: radial-gradient(ellipse, rgba(232,135,91,0.03) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* Card */
    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 48px 44px;
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-raised);
      animation: cardIn 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-bottom: 32px;
    }

    /* Accent divider */
    .login-divider {
      width: 32px; height: 2px;
      background: var(--color-accent);
      border-radius: 1px;
      margin-bottom: 32px;
    }

    /* Form */
    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      margin-bottom: 6px;
      color: var(--color-text-secondary);
      letter-spacing: 0.04em;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-base);
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text-primary);
      outline: none;
      transition: all var(--transition-spring);
    }

    .form-group input::placeholder { color: var(--color-text-muted); }

    .form-group input:focus {
      border-color: var(--color-accent);
      box-shadow: var(--shadow-glow);
      background: var(--color-surface-solid);
    }

    /* Error */
    .login-error {
      color: var(--color-warm);
      font-size: var(--font-size-sm);
      margin-bottom: 16px; display: none;
      padding: 12px 16px;
      border: 1px solid rgba(232,135,91,0.25);
      border-radius: var(--radius-sm);
      background: var(--color-warm-glow);
    }
    .login-error.visible { display: block; }

    /* Submit */
    .btn-primary {
      width: 100%; padding: 14px;
      background: var(--color-accent);
      color: #fff; border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-base);
      font-family: var(--font-body);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all var(--transition-spring);
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: var(--color-accent-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(45,138,122,0.25);
    }
    .btn-primary:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none;
    }

    /* Toggle */
    .toggle-mode {
      text-align: center; margin-top: 24px;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .toggle-mode a {
      color: var(--color-accent);
      cursor: pointer; text-decoration: none;
      font-weight: var(--font-weight-medium);
      transition: color var(--transition-fast);
    }
    .toggle-mode a:hover { color: var(--color-accent-light); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="login-container">
    <h1 class="login-title" id="mode-title">登录</h1>
    <p class="login-sub" id="mode-sub">轻量云盘 · 去重存储</p>
    <div class="login-divider"></div>

    <div class="login-error" id="login-error"></div>

    <form id="auth-form">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" autocomplete="username" required maxlength="64" placeholder="输入用户名">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="输入密码">
      </div>
      <div class="form-group" id="confirm-group" style="display:none;">
        <label for="confirm-password">确认密码</label>
        <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" placeholder="再次输入密码">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">登录</button>
    </form>

    <div class="toggle-mode">
      <span id="toggle-text">没有账户？</span>
      <a id="toggle-link">注册</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
